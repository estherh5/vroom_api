name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      # Install from uv.lock, exactly as the Vercel build does, so CI tests
      # the dependency versions production actually runs.
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install PostgreSQL (for testing.postgresql)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy vroom server.py management.py

      - name: Test (pytest)
        run: uv run pytest --cov=vroom --cov-report=term-missing
